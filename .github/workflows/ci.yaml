name : Archivum CI

on :
  push :
    pull-request:
      workflow-dispatch :

  permissions :
    contents: read


  jobs :
    backend:
      runs-on: ubuntu-latest
      steps :
        - uses : actions/checkout@v7
        - uses: actions/setup-java@v6
          with :
            distribution : temurin
            java-version : '25'
            cache : maven
            cache-dependency-path: backend/pom.xml
        - run: bash ./mvnw -f backend/pom.xml --batch-mode --no-transfer-progress verify

    frontend:
      runs-on: ubuntu-latest
      defaults:
        run :
          working-directory: frontend
          steps:
            - uses: actions/checkout@v7
            - uses : actions/setup-node@v7
              with:
                node-version: '24.19.0'
                cache: npm
                cache-dependency-path: frontend/package-lock.json
            - run: npm ci
            - run : npm test -- --run
            - run: npm run build




