<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
<title>The Orren Plain — an Archivum landscape</title>
<desc>Low, wind-shaped ridges cross an open grassland, with one faint trail disappearing into the distance. Fictional decorative artwork, not world records.</desc>
