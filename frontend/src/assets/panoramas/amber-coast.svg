<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
<title>The Amber Coast — an Archivum landscape</title>
<desc>A long, sandy shoreline curves around a quiet bay beneath broad ochre and sage headlands. Fictional decorative artwork, not world records.</desc>
