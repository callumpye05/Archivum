<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
<title>The Quiet Peaks — an Archivum landscape</title>
<desc>A slate mountain range with parchment-lit summits above a quiet, mist-filled valley. Fictional decorative artwork, not world records.</desc>
