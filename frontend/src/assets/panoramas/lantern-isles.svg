<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
<title>The Lantern Isles — an Archivum landscape</title>
<desc>Five warm stone islands suspended in open teal water, traced by soft shallows and a handful of ridge lines. Fictional decorative artwork, not world records.</desc>
