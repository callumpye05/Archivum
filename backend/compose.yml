services:
  dbservice:
    image: mysql:latest
    container_name: archivumdb
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: archivum
    volumes:
      - /Users/callumpye/Desktop/archivum-data:/var/lib/mysql

  mailpit:
    image: axllent/mailpit:latest
    container_name: archivum-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"